<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chekin — Local Network</title>
<link rel="stylesheet" href="../ds/colors_and_type.css">
<link rel="stylesheet" href="../ds/_sidebar.css">
<link rel="stylesheet" href="../ds/_agent.css">
<link rel="stylesheet" href="ds/_ln.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-nav="local-network"></div>
  <main>
    <header class="top">
      <div class="crumbs"><b>Local Network</b> <span class="sep">/</span> Overview</div>
      <span data-agent-trigger-slot style="margin-left:auto"></span>
      <button class="iconbtn" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4M12 17h.01"/></svg></button>
      <button class="iconbtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><div class="pip"></div></button>
      <div class="user-av">GS</div>
    </header>

    <div class="page">
      <div id="ln-firstrun"></div>
      <div id="ln-persona"></div>
      <div id="ln-subnav"></div>
      <div id="ln-body"></div>
    </div>
  </main>
</div>

<div id="ln-drawer-root"></div>

<script src="data/types.js"></script>
<script src="data/config.js"></script>
<script src="data/fixtures.js"></script>
<script src="services/economics.js"></script>
<script src="services/network-service.js"></script>
<script src="services/earnings-service.js"></script>
<script src="services/admin-service.js"></script>
<script src="agent/agent.js"></script>
<script src="ds/_ln.js"></script>
<script src="../ds/_sidebar.js"></script>
<script src="../ds/_agent.js"></script>
<script>
(function(){
  var S = window.NetworkService, A = window.LNAgent, C = window.LN_CONFIG, I = LN.icons;
  LN.boot({ active:'overview' });

  var persona = S.getPersona();
  var acct = S.currentAccount();
  var body = document.getElementById('ln-body');

  function head(title, sub, cta){
    return '<div class="pagehead reveal"><div><h1>'+LN.esc(title)+'</h1><div class="sub">'+sub+'</div></div>'+(cta||'')+'</div>';
  }
  var submitCta = '<a class="btn-primary" href="submit.html">'+I.plus+' Submit a supplier</a>';

  /* ---------------- first-run: the programme launches empty ---------------- */
  function renderFirstRun(){
    var cat = 'experience', gmv = S.assumedGmv(cat);
    var dest = S.getDestinations().filter(function(d){ return d.supplyDensity!=='high'; })[0] || S.getDestinations()[0];
    // the illustrative example is computed, not written — it can never drift from config
    var liveAt = S._dataset.today;
    var demoClaim = { id:'clm_demo', state:'live', sharingMode:'network', liveAt:liveAt, networkAt:liveAt, bountyId:null,
      roles:[{role:'sourced',holderAccountId:'_',sharePct:C.roleShares.sourced,since:liveAt,until:null},
             {role:'activated',holderAccountId:'_',sharePct:C.roleShares.activated,since:liveAt,until:null},
             {role:'maintained',holderAccountId:'_',sharePct:C.roleShares.maintained,since:liveAt,until:null}] };
    var demoSup = { id:'sup_demo', category:cat, score:0.90 };
    var y1 = S.computeAccrual(gmv, demoClaim, demoSup, dest);
    var five = 0;
    for (var y=0;y<5;y++){
      var la = new Date(liveAt+'T00:00:00Z'); la.setUTCMonth(la.getUTCMonth() - y*12);
      var c2 = {}; for (var k in demoClaim) c2[k]=demoClaim[k];
      c2.liveAt = la.toISOString().slice(0,10); c2.networkAt = c2.liveAt;
      five += S.computeAccrual(gmv, c2, demoSup, dest).poolAmount;
    }
    var openGaps = S.getBounties({ status:'open' }).length;

    body.innerHTML =
      head('Local Network', 'Introduce a local supplier once. Earn on every booking they generate across their coverage area — not just at your own properties.') +
      '<div class="fr-hero reveal">'+
        '<div class="eyebrow">'+I.spark+' New programme</div>'+
        '<h2>Bring a local provider to Chekin, and keep earning wherever they get booked.</h2>'+
        '<p>Once a supplier you introduce goes live, every property inside their coverage area can book them. You earn an ongoing share of the extra commission they accept — scaled by how well they perform, and stepping down over time to a permanent floor. The host serving the guest keeps exactly what they always did.</p>'+
        '<div class="fr-example">'+
          '<div class="b"><div class="n">'+LN.money(y1.poolAmount)+'</div><div class="l">Year 1, on '+LN.money(gmv)+' of bookings</div></div>'+
          '<div class="b"><div class="n">'+LN.money(Math.round(five))+'</div><div class="l">Over 5 years, same supplier</div></div>'+
          '<div class="b"><div class="n">'+LN.pct(C.decaySchedule[C.decaySchedule.length-1].multiplier*100,0)+'</div><div class="l">Perpetual floor — it never stops</div></div>'+
          '<div class="b"><div class="n">'+openGaps+'</div><div class="l">Gaps Chekin is paying a boost to fill</div></div>'+
        '</div>'+
        '<div class="acts">'+
          '<button class="go" onclick="location.href=\'submit.html\'">'+I.plus+' Submit your first supplier</button>'+
          '<button class="alt" onclick="location.href=\'bounties.html\'">See the open gaps</button>'+
        '</div>'+
      '</div>'+
      '<div class="grid3 reveal" style="animation-delay:.06s">'+
        howCard('1. You introduce them', 'Name, contact and coverage. We screen for duplicates, aggregator presence and anything that needs a safety decision — and tell you the reason either way.', I.plus)+
        howCard('2. They go live', 'Bookable by every property in their coverage area. Ranking is blind to who sourced them, so guests always see the best fit.', I.store)+
        howCard('3. You earn, ongoing', 'A share of the '+LN.pct(C.networkPremiumPctOfGmv)+' extra commission they accept. Never taken from the serving host — every rate is explainable on the line.', I.coin)+
      '</div>'+
      '<div class="ln-invariant reveal" style="animation-delay:.1s"><div class="ic">'+I.shield+'</div><div class="tx">'+
        '<div class="t">Serving hosts are never worse off</div>'+
        '<div class="d">A host booking network supply keeps '+LN.pct(C.baseNrpPctOfGmv*C.servingPropertySharePctOfExternalNrp/100)+' of GMV — identical to centrally-sourced inventory — and can block any supplier or category at any time.</div>'+
      '</div><button class="tbtn" id="fr-maths">See the maths</button></div>';

    var b = document.getElementById('fr-maths');
    if (b) b.addEventListener('click', function(){ LN.openEconomicsDrawer({ network:true, poolPct:y1.poolPct, chainHtml: LN.chain(y1) }); });
  }
  function howCard(t, d, ic){
    return '<div class="card"><div class="bd" style="display:flex;flex-direction:column;gap:9px">'+
      '<div class="sav" style="width:38px;height:38px">'+ic+'</div>'+
      '<div style="font:600 15px var(--font-primary)">'+LN.esc(t)+'</div>'+
      '<p style="font:400 13px/19px var(--font-primary);color:var(--text-gray-dark);margin:0">'+d+'</p></div></div>';
  }

  /* ---------------- host / PM ---------------- */
  function renderOwner(){
    var book = S.getSupplyBook(acct.id);
    var t = book.totals;
    var isPm = persona === 'pm';
    var watch = book.entries.filter(function(e){ return e.claim.state==='watch' || e.claim.state==='suspended'; });
    var prog = S.curatorProgress(acct.id);

    var kpis = [
      LN.kpi({ ic:'green', svg:'<path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>', v:t.live, l:'Live claims', d:t.claims+' in total', dc:'flat' }),
      LN.kpi({ ic:'blue', svg:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>', v:LN.money(t.projectedAnnual), l:'Supply book run-rate', d:LN.money(t.fiveYearValue)+' over 5 years', dc:'up' }),
      LN.kpi({ ic:'violet', svg:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5A2.5 2.5 0 0 0 12 8h-.5a2 2 0 0 0 0 4h1a2 2 0 0 1 0 4H12a2.5 2.5 0 0 1-2.5-1.5"/>', v:LN.money(t.mtd,{cents:true}), l:'Residual this month', d:LN.money(t.ytd)+' year to date', dc:'flat' }),
      LN.kpi({ ic: watch.length?'amber':'gray', svg:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>', v:watch.length, l:'Suppliers needing attention', d: watch.length? 'reduced or zero accrual':'all healthy', dc: watch.length?'warn':'up' })
    ].join('');

    body.innerHTML =
      head(isPm ? 'Local Network' : 'Your local suppliers',
        isPm ? 'Every supplier you have introduced, what they earn you, and where the network still has gaps.'
             : 'The suppliers you brought to Chekin, what they earn you, and the gaps worth filling near you.',
        submitCta) +
      (prog.met ? '<div class="ln-invariant reveal" style="animation-delay:.02s"><div class="ic">'+I.star+'</div><div class="tx">'+
        '<div class="t">Local Curator · '+LN.esc((S.getDestinationById((acct.curatorDestinationIds||[])[0])||{}).name||'your destination')+'</div>'+
        '<div class="d">'+prog.liveSuppliers+' live suppliers at an average score of '+prog.avgScore.toFixed(2)+'. Curator status speeds up review — it does not change any rate.</div>'+
      '</div></div>' : '') +
      '<section class="kpis reveal" style="animation-delay:.04s">'+kpis+'</section>'+
      '<div class="grid-2-1 reveal" style="animation-delay:.08s">'+
        '<div class="card"><div class="hd"><h3>Your supply book</h3><div class="act"><a class="tbtn sm" href="supply-book.html">Full book '+I.arrow+'</a></div></div>'+
          '<div class="bd" style="padding:0">'+bookTable(book)+'</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:16px">'+gapsCard()+'</div>'+
      '</div>'+
      '<div class="grid-2-1 reveal" style="animation-delay:.12s">'+
        newInCoverageCard()+
        '<div class="card"><div class="hd"><h3>Activity</h3></div><div class="bd">'+activityFeed()+'</div></div>'+
      '</div>';

    wireBlocks();
  }

  function bookTable(book){
    var rows = book.entries.slice().sort(function(a,b){ return b.projectedAnnual - a.projectedAnnual; }).slice(0,5);
    if (!rows.length) return '<div class="bd">'+LN.empty({ title:'No claims yet', body:'Introduce a local supplier and they will appear here with their live rate and projected residual.', cta:{ label:'Submit a supplier', onclick:"location.href='submit.html'" } })+'</div>';
    return '<div class="table-scroll"><table class="ln"><thead><tr>'+
      '<th>Supplier</th><th>State</th><th class="num">Pool rate</th><th class="num">MTD</th><th class="num">Projected / yr</th><th>Trend</th>'+
      '</tr></thead><tbody>'+rows.map(function(e){
        return '<tr onclick="location.href=\''+LN.supplierHref(e.supplier)+'\'">'+
          '<td><div class="sname"><div class="sav">'+I.store+'</div><div style="min-width:0">'+
            '<div class="nm">'+LN.esc(e.supplier.name)+'</div>'+
            '<div class="em">'+LN.esc(LN.catLabel(e.supplier.category))+' · '+LN.esc(e.destination.name)+'</div></div></div></td>'+
          '<td>'+LN.statePill(e.claim.state)+'</td>'+
          '<td class="num">'+(e.blockedReason ? '<span class="tiny">—</span>' : LN.pct(e.currentPoolPct))+'</td>'+
          '<td class="num">'+LN.money(e.mtdResidual,{cents:true})+'</td>'+
          '<td class="num">'+LN.money(e.projectedAnnual)+'</td>'+
          '<td>'+LN.sparkline(e.trend)+'</td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>';
  }

  function gapsCard(){
    var dest = preferredDest();
    var bounties = S.getBounties({ destination: dest && dest.id, status:'open' }).slice(0,3);
    if (!bounties.length) bounties = S.getBounties({ status:'open' }).slice(0,3);
    if (!bounties.length) return '<div class="card"><div class="hd"><h3>Gaps near you</h3></div><div class="bd"><div class="tiny">No open gaps right now. Chekin publishes a bounty when guests keep searching for something no supplier covers.</div></div></div>';
    return '<div class="card"><div class="hd"><h3>Gaps near you</h3><div class="act"><a class="tbtn sm" href="bounties.html">All gaps</a></div></div>'+
      '<div class="bd" style="display:flex;flex-direction:column;gap:12px">'+bounties.map(function(b){
        return '<div class="card bcard" style="box-shadow:none">'+
          '<div class="boost">×'+b.boostMultiplier.toFixed(2)+' boost</div>'+
          '<h3>'+LN.esc(b.title)+'</h3>'+
          '<div class="meta"><span class="pill brand">'+LN.esc(LN.catLabel(b.category))+'</span>'+
            '<span class="pill">'+LN.esc(b.destination.name)+'</span>'+
            '<span class="cdown'+(b.daysLeft<=14?' warn':'')+'">'+I.clock+b.daysLeft+'d left</span></div>'+
          '<div class="gap"><div class="g1">'+LN.num(b.gapEvidence.emptyDecisions)+' guest searches ended with no eligible supplier</div>'+
            '<div class="g2">'+LN.num(b.gapEvidence.searches)+' searches, '+LN.esc(b.gapEvidence.period)+' in '+LN.esc(b.destination.name)+'.</div></div>'+
          '<div class="money"><div class="mbox"><div class="mv">'+LN.money(b.projectedAnnualResidual)+'</div><div class="ml">Projected year 1</div></div>'+
            '<div class="mbox"><div class="mv">'+LN.money(b.activationBonus)+'</div><div class="ml">Activation bonus</div></div></div>'+
          '<a class="btn-primary" style="justify-content:center" href="submit.html?bounty='+b.id+'">'+I.plus+' Fill this gap</a>'+
        '</div>';
      }).join('')+'</div></div>';
  }
  function preferredDest(){
    var props = S.getProperties(acct.id), counts = {}, best=null;
    props.forEach(function(p){ counts[p.destinationId]=(counts[p.destinationId]||0)+1; });
    Object.keys(counts).forEach(function(k){ if(!best||counts[k]>counts[best]) best=k; });
    return best ? S.getDestinationById(best) : null;
  }

  function newInCoverageCard(){
    var rows = S.getNewInCoverage(acct.id, 4);
    var inner = rows.length ? rows.map(function(r){
      return '<div class="fitem"><div class="fi info">'+I.store+'</div><div class="ftx">'+
        '<div class="t"><a href="'+LN.supplierHref(r.supplier)+'">'+LN.esc(r.supplier.name)+'</a></div>'+
        '<div class="d">'+LN.esc(LN.catLabel(r.supplier.category))+' · '+r.distanceKm+' km · score '+r.supplier.score.toFixed(2)+
          ' · <span class="attrib">'+I.users+'sourced by '+LN.esc(r.sourcedByName)+'</span></div></div>'+
        '<button class="tbtn sm '+(r.blocked?'brand':'')+'" data-block="'+r.supplier.id+'">'+(r.blocked?'Unblock':I.block+' Block')+'</button></div>';
    }).join('') : '<div class="tiny">Nothing new has become available to your properties in the last six months.</div>';
    return '<div class="card"><div class="hd"><h3>New in your coverage</h3>'+
      '<div class="act"><a class="tbtn sm" href="discover.html">All network supply</a></div></div>'+
      '<div class="bd"><div class="tiny" style="margin-bottom:10px">Supply other hosts introduced that your guests can now book. You keep your usual share on every one, and you can block any of them.</div>'+
      '<div class="feed" id="new-cov">'+inner+'</div></div></div>';
  }
  function wireBlocks(){
    var el = document.getElementById('new-cov');
    if (!el) return;
    el.addEventListener('click', function(e){
      var b = e.target.closest('[data-block]'); if (!b) return;
      var id = b.getAttribute('data-block');
      var sup = S.getSupplierById(id);
      var already = S.getProperties(acct.id).some(function(p){ return p.blockedSupplierIds.indexOf(id)>=0; });
      if (already){ S.unblockSupplierForAccount(acct.id, id); LN.toast(sup.name+' is bookable again at your properties.'); }
      else { S.blockSupplierForAccount(acct.id, id); LN.toast(sup.name+' blocked at your properties. Their claim and score are unaffected.'); }
      renderOwner();
    });
  }

  function activityFeed(){
    var rows = S.getActivity({ limit: 8 });
    if (!rows.length) return '<div class="tiny">Nothing has happened yet.</div>';
    return '<div class="feed">'+rows.map(function(a){
      var sup = S.getSupplierById(a.supplierId);
      return '<div class="fitem"><div class="fi '+LN.feedKind(a.kind)+'">'+LN.feedIcon(a.kind)+'</div>'+
        '<div class="ftx"><div class="t">'+LN.esc(a.title)+(sup?' · <a href="'+LN.supplierHref(sup)+'">'+LN.esc(sup.name)+'</a>':'')+'</div>'+
        '<div class="d">'+LN.esc(a.detail)+'</div></div>'+
        '<div class="fw">'+LN.relDate(a.at)+'</div></div>';
    }).join('')+'</div>';
  }

  /* ---------------- supplier ---------------- */
  function renderSupplier(){
    var sup = S.getSupplierById(S._dataset.supplierAccountSupplierId);
    if (!sup){ body.innerHTML = head('Your listing','No supplier record is linked to this account yet.'); return; }
    var claim = S.getClaimBySupplier(sup.id);
    var dest = S.getDestinationById(sup.destinationId);
    var lines = S.getAccruals({ supplierId: sup.id });
    var gmv12 = lines.filter(function(a){ return a.periodMonth >= monthsAgo(12); }).reduce(function(t,a){ return t+a.gmv; },0);
    var bookings = lines.filter(function(a){ return a.periodMonth >= monthsAgo(12); }).length;

    body.innerHTML =
      head(sup.name, LN.esc(sup.subcategory)+' in '+LN.esc(dest.name)+' · you are viewing Chekin as the supplier.') +
      '<section class="kpis reveal" style="animation-delay:.04s">'+
        LN.kpi({ ic:'green', svg:'<path d="M20 6 9 17l-5-5"/>', v:LN.stateLabel(claim?claim.state:'—'), l:'Claim state' })+
        LN.kpi({ ic:'blue', svg:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>', v:LN.num(bookings), l:'Bookings, last 12 months' })+
        LN.kpi({ ic:'violet', svg:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10"/>', v:LN.money(gmv12), l:'Booking value, last 12 months' })+
        LN.kpi({ ic: sup.score>=0.75?'green':'amber', svg:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>', v:sup.score.toFixed(2), l:'Quality score · '+S.qualityBand(sup.score).label })+
      '</section>'+
      '<div class="grid-2-1 reveal" style="animation-delay:.08s">'+
        '<div style="display:flex;flex-direction:column;gap:16px">'+
          LN.section('Your quality score', LN.gauge(sup.score)+'<div style="margin-top:16px">'+LN.drivers(sup.scoreBreakdown)+'</div>')+
          LN.section('Recent bookings', bookingsTable(lines.slice(0,8)))+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:16px">'+
          LN.section('Profile completeness',
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="meter '+(sup.contentCompleteness>=80?'green':'amber')+'" style="flex:1"><i style="width:'+sup.contentCompleteness+'%"></i></div>'+
            '<b class="num">'+sup.contentCompleteness+'%</b></div>'+ contentChecklist(sup))+
          LN.section('Where you can be booked',
            LN.coverageMap(sup.coverage.km, sup.coverage.capKm, sup.coverage.propertiesInCoverage, dest.activeProperties)+
            '<div class="covreach"><div class="big">'+sup.coverage.propertiesInCoverage+'</div><div class="tx">properties in '+LN.esc(dest.name)+' can book you, within '+sup.coverage.km+' km (category cap '+sup.coverage.capKm+' km).</div></div>')+
        '</div>'+
      '</div>';
  }
  function monthsAgo(n){ var d=new Date(S._dataset.today+'T00:00:00Z'); d.setUTCMonth(d.getUTCMonth()-n); return d.toISOString().slice(0,7); }
  function bookingsTable(rows){
    if (!rows.length) return '<div class="tiny">No bookings yet.</div>';
    var props = S.getProperties();
    return '<div class="table-scroll"><table class="ln"><thead><tr><th>Property</th><th>Month</th><th class="num">Value</th></tr></thead><tbody>'+
      rows.map(function(a){
        var p = props.filter(function(x){ return x.id===a.servingPropertyId; })[0];
        return '<tr style="cursor:default"><td>'+LN.esc(p?p.name:a.servingPropertyId)+'</td><td>'+LN.esc(LN.monthLabel(a.periodMonth))+'</td><td class="num">'+LN.money(a.gmv)+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  function contentChecklist(sup){
    var ALL = ['photos','price_list','cancellation_policy','languages','insurance_certificate','accessibility_notes'];
    return '<div class="checklist">'+ALL.map(function(k){
      var missing = (sup.missingContent||[]).indexOf(k) >= 0;
      return '<div class="citem'+(missing?'':' done')+'"><div class="cb">'+(missing?I.plus:I.check)+'</div>'+
        '<div class="ctx">'+LN.esc(k.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}))+'</div>'+
        (missing?'<button class="tbtn sm" onclick="LN.toast(\'Upload flow is not part of this prototype.\')">Add</button>':'')+'</div>';
    }).join('')+'</div>';
  }

  /* ---------------- Chekin internal ---------------- */
  function renderChekin(){
    var dests = S.getDestinations();
    body.innerHTML =
      head('Local Network · Chekin', 'Destination coverage, the supplier pipeline and the bounties we are paying to fill.',
        '<a class="btn-primary" href="bounties.html">'+I.target+' Manage bounties</a>') +
      '<section class="kpis reveal" style="animation-delay:.04s">'+
        LN.kpi({ ic:'blue', svg:'<path d="M9 3 3 5.5v16L9 19l6 2.5 6-2.5v-16L15 5.5 9 3z"/>', v:dests.length, l:'Destinations' })+
        LN.kpi({ ic:'green', svg:'<path d="M20 6 9 17l-5-5"/>', v:S.getSuppliers({status:'live'}).length, l:'Live suppliers' })+
        LN.kpi({ ic:'violet', svg:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>', v:S.getBounties({status:'open'}).length, l:'Open bounties' })+
        LN.kpi({ ic:'amber', svg:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/>', v:S.getReviewQueue().length, l:'Claims in the pipeline' })+
      '</section>'+
      '<div class="card reveal" style="animation-delay:.08s"><div class="hd"><h3>Destination coverage</h3></div><div class="bd" style="padding:0">'+
        '<div class="table-scroll"><table class="ln"><thead><tr><th>Destination</th><th>Density</th><th class="num">Properties</th><th class="num">Live suppliers</th><th>Categories covered</th><th class="num">Open gaps</th><th>Density floor</th></tr></thead><tbody>'+
        dests.map(function(d){
          var gaps = S.getBounties({destination:d.id,status:'open'}).length;
          return '<tr onclick="location.href=\'bounties.html?destination='+d.id+'\'">'+
            '<td><b>'+LN.esc(d.name)+'</b></td>'+
            '<td><span class="badge '+(d.supplyDensity==='high'?'green':d.supplyDensity==='medium'?'blue':'amber')+'">'+LN.esc(d.supplyDensity)+'</span></td>'+
            '<td class="num">'+LN.num(d.activeProperties)+'</td><td class="num">'+LN.num(d.liveSuppliers)+'</td>'+
            '<td><div style="display:flex;gap:5px;flex-wrap:wrap">'+d.categoriesCovered.map(function(c){ return '<span class="pill">'+LN.esc(LN.catLabel(c))+'</span>'; }).join('')+'</div></td>'+
            '<td class="num">'+gaps+'</td>'+
            '<td>'+(d.densityFloorMet?'<span class="badge green">Met</span>':'<span class="badge amber">Not met</span>')+'</td></tr>';
        }).join('')+'</tbody></table></div></div></div>'+
      '<div class="grid2 reveal" style="animation-delay:.12s">'+
        LN.section('Supplier pipeline', pipelineList())+
        LN.section('Activity', activityFeed())+
      '</div>';
  }
  function pipelineList(){
    var q = S.getReviewQueue();
    if (!q.length) return '<div class="tiny">Nothing in the pipeline.</div>';
    return '<div class="feed">'+q.map(function(r){
      return '<div class="fitem"><div class="fi info">'+I.doc+'</div><div class="ftx">'+
        '<div class="t"><a href="'+LN.supplierHref(r.supplier)+'">'+LN.esc(r.supplier.name)+'</a> '+LN.statePill(r.claim.state)+' '+LN.countdownChip(r.claim)+'</div>'+
        '<div class="d">'+LN.esc(LN.catLabel(r.supplier.category))+' · introduced by '+LN.esc((r.account||{}).name||'—')+(r.hardGate?' · <b style="color:var(--text-danger)">safety gate</b>':'')+'</div></div>'+
        '<div class="fw">'+r.waitingDays+'d</div></div>';
    }).join('')+'</div>';
  }

  /* ---------------- Admin ---------------- */
  function renderAdmin(){
    var q = S.getReviewQueue(), flags = S.getFlags(), watch = S.getQualityWatch(), susp = S.getSuspensions();
    body.innerHTML =
      head('Local Network · Admin', 'Claims awaiting a decision, flags raised for a human, and the quality watchlist.',
        '<a class="btn-primary" href="admin-review.html">'+I.shield+' Open the review queue</a>') +
      '<section class="kpis reveal" style="animation-delay:.04s">'+
        LN.kpi({ ic:'blue', svg:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>', v:q.length, l:'Claims awaiting decision' })+
        LN.kpi({ ic:'red', svg:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/>', v:flags.filter(function(f){return f.severity==='high';}).length, l:'High-severity flags', d:flags.length+' flags in total', dc:'warn' })+
        LN.kpi({ ic:'amber', svg:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>', v:watch.length, l:'On the quality watchlist' })+
        LN.kpi({ ic:'gray', svg:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>', v:susp.length, l:'Suspensions on record' })+
      '</section>'+
      '<div class="grid2 reveal" style="animation-delay:.08s">'+
        LN.section('Needs a decision', pipelineList(), '<a class="tbtn sm" href="admin-review.html">Open queue</a>')+
        LN.section('Flags', flags.length ? '<div class="feed">'+flags.slice(0,6).map(function(f){
          return '<div class="fitem"><div class="fi '+(f.severity==='high'?'bad':f.severity==='medium'?'warn':'')+'">'+I.warn+'</div>'+
            '<div class="ftx"><div class="t">'+LN.esc(f.title)+'</div><div class="d">'+LN.esc(f.detail)+'</div></div>'+
            '<div class="fw">'+LN.esc(f.severity)+'</div></div>';
        }).join('')+'</div>' : '<div class="tiny">No open flags.</div>', '<a class="tbtn sm" href="admin-review.html?tab=flags">All flags</a>')+
      '</div>';
  }

  /* ---------------- route ---------------- */
  if (S.isFirstRun()) renderFirstRun();
  else if (persona === 'supplier') renderSupplier();
  else if (persona === 'chekin') renderChekin();
  else if (persona === 'admin') renderAdmin();
  else renderOwner();
})();
</script>
</body>
</html>
