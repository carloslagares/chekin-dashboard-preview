<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chekin — Local Network · Supply book</title>
<link rel="stylesheet" href="../ds/colors_and_type.css">
<link rel="stylesheet" href="../ds/_sidebar.css">
<link rel="stylesheet" href="../ds/_agent.css">
<link rel="stylesheet" href="ds/_ln.css">
<style>
  .roletags{display:inline-flex;gap:3px}
  .roletag{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:800 10px var(--font-primary);background:var(--bg-blue-light);color:var(--text-brand)}
  .roletag.off{background:var(--bg-neutral-light);color:var(--text-gray-light)}
  .curator{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--radius-lg);border:1px solid #F5D9A8;background:linear-gradient(90deg,#FFF7EC,#FFF2E0)}
  .curator .ic{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid #F5D9A8;display:grid;place-items:center;color:var(--text-amber);flex-shrink:0}
  .curator .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
</style>
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-nav="local-network"></div>
  <main>
    <header class="top">
      <div class="crumbs"><a href="index.html"><b>Local Network</b></a> <span class="sep">/</span> Supply book</div>
      <span data-agent-trigger-slot style="margin-left:auto"></span>
      <button class="iconbtn" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4M12 17h.01"/></svg></button>
      <button class="iconbtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><div class="pip"></div></button>
      <div class="user-av">GS</div>
    </header>

    <div class="page">
      <div id="ln-firstrun"></div>
      <div id="ln-persona"></div>
      <div id="ln-subnav"></div>
      <div id="ln-body"></div>
    </div>
  </main>
</div>

<div id="ln-drawer-root"></div>

<script src="data/types.js"></script>
<script src="data/config.js"></script>
<script src="data/fixtures.js"></script>
<script src="services/economics.js"></script>
<script src="services/network-service.js"></script>
<script src="services/earnings-service.js"></script>
<script src="services/admin-service.js"></script>
<script src="agent/agent.js"></script>
<script src="ds/_ln.js"></script>
<script src="../ds/_sidebar.js"></script>
<script src="../ds/_agent.js"></script>
<script>
(function(){
  var S = window.NetworkService, C = window.LN_CONFIG, I = LN.icons;
  LN.boot({ active:'supply-book' });

  var persona = S.getPersona();
  var body = document.getElementById('ln-body');
  var internal = persona === 'chekin' || persona === 'admin';

  // Internal staff look at the whole programme; a supplier has no book at all.
  if (persona === 'supplier'){
    body.innerHTML = '<div class="pagehead reveal"><div><h1>Supply book</h1>'+
      '<div class="sub">The supply book belongs to the hosts who introduce suppliers.</div></div></div>'+
      '<div class="card"><div class="bd">'+LN.empty({ title:'Not your view', icon:I.store,
        body:'You are viewing Chekin as a supplier. Your bookings, score and profile live on the overview.',
        cta:{ label:'Go to your overview', onclick:"location.href='index.html'" } })+'</div></div>';
    return;
  }

  var acctId = internal ? null : S.currentAccountId();
  var state = { state:'', mode:'', destination:'', risk:'', selected:null };

  function books(){
    if (!internal) return [S.getSupplyBook(acctId)];
    // one book per owning account, flattened — the programme-wide view
    return S.getAccounts().filter(function(a){ return a.type!=='supplier'; }).map(function(a){ return S.getSupplyBook(a.id); });
  }
  function allEntries(){
    var out = [];
    books().forEach(function(b){ b.entries.forEach(function(e){ out.push(e); }); });
    return out;
  }
  function filtered(rows){
    return rows.filter(function(e){
      if (state.state && e.claim.state !== state.state) return false;
      if (state.mode && e.claim.sharingMode !== state.mode) return false;
      if (state.destination && e.supplier.destinationId !== state.destination) return false;
      if (state.risk === 'risk' && !e.atRisk) return false;
      if (state.risk === 'earning' && e.currentPoolPct <= 0) return false;
      return true;
    });
  }

  function totalsOf(rows){
    function sum(k){ return Math.round(rows.reduce(function(t,e){ return t + e[k]; },0)*100)/100; }
    var five = 0;
    rows.forEach(function(e){
      S.projectResidual(e.claim.id, 5, ownerOf(e)).forEach(function(y){ five += y.amount; });
    });
    return { mtd:sum('mtdResidual'), ytd:sum('ytdResidual'), lifetime:sum('lifetimeResidual'),
      projectedAnnual:sum('projectedAnnual'), gmv:sum('liveGmv'), fiveYear:Math.round(five) };
  }
  function ownerOf(e){
    if (!internal) return acctId;
    var held = (e.claim.roles||[]).filter(function(r){ return !r.until; })[0];
    return held ? held.holderAccountId : e.claim.sourcingAccountId;
  }

  function render(){
    var rows = allEntries();
    var shown = filtered(rows);
    var t = totalsOf(shown);
    var prog = internal ? null : S.curatorProgress(acctId);
    if (!state.selected || !shown.some(function(e){ return e.claim.id===state.selected; })){
      var live = shown.filter(function(e){ return e.currentPoolPct>0; });
      state.selected = (live[0] || shown[0] || {}).claim ? (live[0]||shown[0]).claim.id : null;
    }

    body.innerHTML =
      '<div class="pagehead reveal"><div><h1>Supply book <span class="count">'+shown.length+'</span></h1>'+
        '<div class="sub">'+(internal
          ? 'Every claim in the programme, with the rate it earns today and what it is worth over five years.'
          : 'Your claims as an asset: what each one earns now, and what the decay schedule says it is worth over five years.')+'</div></div>'+
        '<a class="btn-primary" href="submit.html">'+I.plus+' Submit a supplier</a></div>'+
      (prog && prog.met ? '<div class="curator reveal"><div class="ic">'+I.star+'</div><div style="flex:1">'+
        '<div style="font:600 14px var(--font-primary)">Local Curator</div>'+
        '<div class="tiny" style="font-size:12.5px">'+prog.liveSuppliers+' live suppliers, average score '+prog.avgScore.toFixed(2)+
        ' — above the threshold of '+prog.needLive+' and '+prog.needScore.toFixed(2)+'. Curator status shortens review time; it changes no rate.</div></div></div>' : '')+
      '<section class="kpis reveal" style="animation-delay:.04s">'+
        LN.kpi({ ic:'blue', svg:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>', v:LN.money(t.projectedAnnual), l:'Annual run-rate' })+
        LN.kpi({ ic:'green', svg:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5A2.5 2.5 0 0 0 12 8h-.5a2 2 0 0 0 0 4h1a2 2 0 0 1 0 4H12a2.5 2.5 0 0 1-2.5-1.5"/>', v:LN.money(t.fiveYear), l:'5-year book value' })+
        LN.kpi({ ic:'violet', svg:'<path d="M20.6 8.4 12 17 3.4 8.4"/><path d="M3 8h18l-1 4H4z"/>', v:LN.money(t.gmv), l:'Bookings driven, last 12 months' })+
        LN.kpi({ ic:'gray', svg:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', v:LN.money(t.lifetime), l:'Earned to date' })+
      '</section>'+
      filters(rows)+
      '<div class="card reveal" style="animation-delay:.1s"><div class="bd" style="padding:0">'+table(shown, t)+'</div></div>'+
      curveCard();

    wire();
  }

  function filters(rows){
    function group(id, label, opts, cur){
      return '<div class="chips" data-group="'+id+'"><span class="tiny" style="margin-right:2px">'+label+'</span>'+
        opts.map(function(o){
          var n = o.v==='' ? rows.length : rows.filter(o.f).length;
          return '<button class="chip'+(cur===o.v?' active':'')+'" data-val="'+o.v+'">'+LN.esc(o.l)+' <span class="count">'+n+'</span></button>';
        }).join('')+'</div>';
    }
    var states = ['live','watch','onboarding','pending_supplier','screening','draft','suspended','dormant','expired','terminated','released'];
    return '<section class="reveal" style="animation-delay:.08s;display:flex;flex-direction:column;gap:10px">'+
      group('state','State', [{v:'',l:'All',f:function(){return true;}}].concat(states.map(function(s){
        return { v:s, l:LN.stateLabel(s), f:function(e){ return e.claim.state===s; } };
      }).filter(function(o){ return rows.some(o.f); })), state.state)+
      group('mode','Sharing', [{v:'',l:'All',f:function(){return true;}}].concat(['network','delayed','private'].map(function(m){
        return { v:m, l:LN.modeLabel(m), f:function(e){ return e.claim.sharingMode===m; } };
      })), state.mode)+
      group('destination','Destination', [{v:'',l:'All',f:function(){return true;}}].concat(S.getDestinations().map(function(d){
        return { v:d.id, l:d.name, f:function(e){ return e.supplier.destinationId===d.id; } };
      })), state.destination)+
      group('risk','Health', [{v:'',l:'All',f:function(){return true;}},
        {v:'earning',l:'Earning now',f:function(e){ return e.currentPoolPct>0; }},
        {v:'risk',l:'At risk',f:function(e){ return e.atRisk; }}], state.risk)+
    '</section>';
  }

  function roleTags(e){
    return '<div class="roletags">'+['sourced','activated','maintained'].map(function(r){
      var on = e.rolesHeld.indexOf(r)>=0;
      return '<span class="roletag'+(on?'':' off')+'" title="'+r+' · '+C.roleShares[r]+'%">'+r.charAt(0).toUpperCase()+'</span>';
    }).join('')+'</div>';
  }

  function table(rows, t){
    if (!rows.length) return '<div class="bd">'+LN.empty({
      title: allEntries().length ? 'No claims match these filters' : 'Your supply book is empty',
      icon: I.store,
      body: allEntries().length ? 'Clear a filter to see the rest of the book.'
        : 'Every supplier you introduce becomes a line here — with its live rate, its decay step and what it is projected to earn. Start with a gap Chekin is already paying a boost to fill.',
      cta: allEntries().length ? null : { label:'Submit a supplier', onclick:"location.href='submit.html'" }
    })+'</div>';
    return '<div class="table-scroll"><table class="ln"><thead><tr>'+
      '<th>Supplier</th><th>State</th><th>Roles</th><th>Sharing</th>'+
      '<th class="num">GMV 12m</th><th class="num">Pool rate</th><th class="num">MTD</th><th class="num">Projected / yr</th><th>Trend</th>'+
      '</tr></thead><tbody>'+
      rows.map(function(e){
        var sel = e.claim.id === state.selected;
        return '<tr data-claim="'+e.claim.id+'"'+(sel?' class="sel"':'')+'>'+
          '<td><div class="sname"><div class="sav">'+I.store+'</div><div style="min-width:0">'+
            '<div class="nm">'+LN.esc(e.supplier.name)+'</div>'+
            '<div class="em">'+LN.esc(LN.catLabel(e.supplier.category))+' · '+LN.esc(e.destination.name)+
            (internal ? ' · '+LN.esc((S.getAccountById(e.claim.sourcingAccountId)||{}).name||'') : '')+'</div></div></div></td>'+
          '<td>'+LN.statePill(e.claim.state)+' '+LN.countdownChip(e.claim)+'</td>'+
          '<td>'+roleTags(e)+'<div class="tiny">'+e.roleSharePct+'%</div></td>'+
          '<td>'+LN.modePill(e.claim.sharingMode)+'</td>'+
          '<td class="num">'+LN.money(e.liveGmv)+'</td>'+
          '<td class="num">'+(e.blockedReason ? '<span class="badge gray">none</span>' : '<b>'+LN.pct(e.currentPoolPct)+'</b>')+'</td>'+
          '<td class="num">'+LN.money(e.mtdResidual,{cents:true})+'</td>'+
          '<td class="num"><b>'+LN.money(e.projectedAnnual)+'</b></td>'+
          '<td>'+LN.sparkline(e.trend)+'</td>'+
        '</tr>';
      }).join('')+
      '<tr class="totals"><td colspan="4">Total · '+rows.length+' claim'+(rows.length===1?'':'s')+'</td>'+
        '<td class="num">'+LN.money(t.gmv)+'</td><td class="num">—</td>'+
        '<td class="num">'+LN.money(t.mtd,{cents:true})+'</td>'+
        '<td class="num">'+LN.money(t.projectedAnnual)+'</td>'+
        '<td class="tiny">'+LN.money(t.fiveYear)+' / 5yr</td></tr>'+
      '</tbody></table></div>';
  }

  function curveCard(){
    if (!state.selected) return '';
    var e = allEntries().filter(function(x){ return x.claim.id===state.selected; })[0];
    if (!e) return '';
    var owner = ownerOf(e);
    var series = S.projectResidual(e.claim.id, 5, owner);
    var acr = S.computeAccrual(100, e.claim, e.supplier, e.destination);
    var five = Math.round(series.reduce(function(t,y){ return t+y.amount; },0));
    return '<div class="grid-2-1 reveal" style="animation-delay:.14s">'+
      '<div class="card"><div class="hd"><h3>Residual over five years · '+LN.esc(e.supplier.name)+'</h3>'+
        '<div class="act"><a class="tbtn sm" href="'+LN.supplierHref(e.supplier)+'">Open supplier '+I.arrow+'</a></div></div>'+
        '<div class="bd">'+
          (e.blockedReason
            ? '<div class="ln-note"><div class="ic">'+I.info+'</div><div class="tx">'+LN.esc(e.blockedReason)+'</div></div>'
            : '<div class="tiny" style="margin-bottom:8px">Trailing-12-month bookings of '+LN.money(series[0].gmv)+' held flat, so the shape you see is purely the decay schedule.</div>')+
          LN.decayCurve(series)+
        '</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:16px">'+
        LN.section('This year\'s rate', LN.chain(acr)+
          '<div class="tiny" style="margin-top:10px">Per '+LN.money(100)+' of bookings. '+
          (acr.saturated ? LN.esc(e.destination.name)+' already covers '+LN.esc(LN.catLabel(e.supplier.category))+' well, so the premium is capped at '+LN.pct(acr.premiumCapPct)+'.' : 'Full premium of '+LN.pct(acr.premiumCapPct)+' available here.')+'</div>'+
          '<div style="margin-top:12px"><button class="tbtn sm" id="see-maths">See the maths</button></div>')+
        LN.section('Decay schedule', '<div class="kv">'+C.decaySchedule.map(function(s,i){
          var on = series[0].decayStep === i+1;
          return '<div class="row"><div class="k">'+LN.esc(s.label)+'</div><div class="v">×'+s.multiplier.toFixed(2)+
            (on?' <span class="badge blue">current</span>':'')+'</div></div>';
        }).join('')+'</div>')+
        LN.section('Five-year value', '<div style="font:800 30px var(--font-primary);color:var(--text-brand)" class="num">'+LN.money(five)+'</div>'+
          '<div class="tiny" style="margin-top:4px">'+series.map(function(y){ return 'Y'+y.year+' '+LN.money(y.amount); }).join(' · ')+'</div>')+
      '</div></div>';
  }

  function wire(){
    document.querySelectorAll('[data-group]').forEach(function(el){
      el.addEventListener('click', function(e){
        var chip = e.target.closest('.chip'); if (!chip) return;
        state[el.getAttribute('data-group')] = chip.getAttribute('data-val');
        render();
      });
    });
    document.querySelectorAll('[data-claim]').forEach(function(tr){
      tr.addEventListener('click', function(){ state.selected = tr.getAttribute('data-claim'); render(); });
    });
    var m = document.getElementById('see-maths');
    if (m) m.addEventListener('click', function(){
      var e = allEntries().filter(function(x){ return x.claim.id===state.selected; })[0];
      var a = S.computeAccrual(100, e.claim, e.supplier, e.destination);
      LN.openEconomicsDrawer({ network:true, poolPct:a.poolPct, supplierName:e.supplier.name, chainHtml:LN.chain(a) });
    });
  }

  render();
})();
</script>
</body>
</html>
